server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # gzip 对 JS/CSS 效果最明显，JSON 不压缩（API 响应通常已经是小包）
  gzip on;
  gzip_min_length 1k;
  gzip_comp_level 5;
  gzip_vary on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # 带 hash 的静态资源可以长期强缓存
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html 绝不能缓存，否则发版后用户仍加载旧 chunk 导致白屏
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }

  # 前端是 BrowserRouter（history 路由），/creators/xxx 这类深链
  # 在 nginx 上并没有对应文件，必须回落到 index.html 交给前端路由
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 反向代理到同网络的 api 容器；/api 前缀要保留，后端路由即挂在 /api 下
  location /api/ {
    proxy_pass http://api:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 结算导出 / AI 长任务可能超过默认 60s
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    # 导出 CSV 时不要缓冲整个响应，边生成边下发
    proxy_buffering off;
  }
}
